<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 팀 설정</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<script src="api.js"></script>
</head>

<body class="bg-page dark:bg-canvas text-ink dark:text-fg font-sans antialiased min-h-screen flex flex-col">

<header class="sticky top-0 z-30 bg-white dark:bg-canvas border-b border-line dark:border-edge">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
    <a href="meetings.html" class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-ink dark:bg-fg grid place-items-center text-white dark:text-canvas font-extrabold text-sm">M</div>
      <span class="font-extrabold tracking-tight">MeetingNote</span>
    </a>
    <nav class="flex items-center gap-1 text-[13px] font-bold ml-2 min-w-0 overflow-x-auto">
      <a href="meetings.html" class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">회의록</a>
      <a href="todos.html" class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">할 일</a>
      <span class="px-2.5 py-1 rounded-lg bg-page dark:bg-chip">팀</span>
      <a href="profile.html" class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">내 정보</a>
    </nav>
    <div class="ml-auto flex items-center gap-2" id="themeSlot"></div>
  </div>
</header>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5 space-y-4">

  <!-- 팀 만들기 / 합류 (소속 팀이 없을 때) -->
  <section id="onboard" class="hidden rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge
           border-l-[6px] border-l-purple-dot p-5">
    <h1 class="text-lg font-extrabold">아직 소속 팀이 없음</h1>
    <p class="text-[13px] text-ink-2 dark:text-dim mt-1">팀을 새로 만들거나, 받은 초대코드로 합류</p>
    <div class="mt-4 grid gap-3 sm:grid-cols-2">
      <div class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge p-4">
        <p class="text-[13px] font-extrabold mb-2">팀 만들기</p>
        <input class="w-full h-11 px-3.5 rounded-xl bg-white dark:bg-surface border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition" placeholder="팀 이름">
        <button class="mt-2.5 w-full h-11 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold hover:opacity-90 transition">만들기</button>
      </div>
      <div class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge p-4">
        <p class="text-[13px] font-extrabold mb-2">초대코드로 합류</p>
        <input id="joinCode" class="w-full h-11 px-3.5 rounded-xl bg-white dark:bg-surface border border-line dark:border-edge text-sm font-mono tracking-widest focus:outline-none focus:border-blue-dot transition" placeholder="MN-7K2D">
        <button class="mt-2.5 w-full h-11 rounded-xl bg-white dark:bg-surface border border-line dark:border-edge text-sm font-bold hover:border-ink dark:hover:border-dim transition">합류</button>
      </div>
    </div>
    <div id="joinErr" class="hidden mt-3"></div>
  </section>

  <!-- 팀 정보 -->
  <section id="info" class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex flex-wrap items-start gap-4">
      <div class="flex-1 min-w-[200px]">
        <p class="text-[11px] font-bold text-ink-3 dark:text-dim mb-1">팀 이름</p>
        <input id="tName" value="기획팀"
          class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm font-bold focus:outline-none focus:border-blue-dot transition">
        <button id="saveName" type="button" class="mt-2 h-9 px-4 rounded-xl bg-blue-dot text-white text-[13px] font-bold">이름 저장</button>
      </div>
      <div>
        <p class="text-[11px] font-bold text-ink-3 dark:text-dim mb-1">초대코드</p>
        <div class="flex gap-2">
          <div class="h-11 px-4 grid place-items-center rounded-xl bg-page dark:bg-chip border border-line dark:border-edge
                      font-mono text-sm font-extrabold tracking-[0.2em]" id="code">MN-7K2D</div>
          <button id="copyBtn" class="h-11 px-3.5 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-[13px] font-bold hover:border-ink dark:hover:border-dim transition">복사</button>
          <button id="newCodeBtn" class="h-11 px-3.5 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-[13px] font-bold hover:border-ink dark:hover:border-dim transition">재발급</button>
        </div>
      </div>
    </div>
    <div id="codeMsg" class="hidden mt-3"></div>
  </section>

  <!-- 멤버 -->
  <section class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="text-sm font-extrabold">멤버 <span id="mCap" class="text-ink-3 dark:text-dim font-bold">4 / 6</span></h2>
      <span class="ml-auto text-[11px] text-ink-3 dark:text-dim">팀당 6명 이내</span>
    </div>
    <ul id="members" class="grid gap-2 sm:grid-cols-2"></ul>
  </section>

  <!-- 활동 기록 -->
  <section class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="text-sm font-extrabold">활동 기록</h2>
      <span class="text-[11px] text-ink-3 dark:text-dim">최근 순</span>
    </div>
    <ol id="acts" class="space-y-2.5"></ol>
  </section>
</main>

<script>
  document.getElementById("themeSlot").innerHTML = window.THEME_BTN;
  window.initTheme(() => render());

  const $ = (id) => document.getElementById(id);
  const esc = API.esc;
  let TEAM = null, ME = null, MEMBERS = [], ACTS = [];
  const sections = [...document.querySelectorAll("main > section")];   // onboard · info · 멤버 · 활동 기록
  const [createBox, joinBox] = [...document.querySelectorAll("#onboard .grid > div")];

  function render(){
    $("members").innerHTML = MEMBERS.map(m => `
      <li class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge p-3 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-white dark:bg-surface border border-line dark:border-edge grid place-items-center text-[13px] font-extrabold">${esc(m.name[0])}</div>
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-bold">${esc(m.name)}</p>
          <p class="text-[11px] text-ink-3 dark:text-dim truncate">${esc(m.email)}</p>
        </div>
        <div class="text-right shrink-0">
          <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold ${m.role === "owner" ? window.LABEL.purple : "text-ink-2 dark:text-dim"} bg-white dark:bg-surface">${m.role}</span>
          <p class="mt-1 text-[10px] text-ink-3 dark:text-dim">할 일 ${m.todo_count}</p>
        </div>
      </li>`).join("");
    $("mCap").textContent = MEMBERS.length + " / 6";
    // 활동 띠 색은 kind 로. 문장은 서버가 만든 것을 그대로 그린다
    $("acts").innerHTML = ACTS.length ? ACTS.map(a => `
      <li class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge ${window.STRIPE[API.ACT_COLOR[a.kind]]} px-3.5 py-2.5">
        <p class="text-[13px]">${esc(a.text)}</p>
        <p class="text-[11px] text-ink-3 dark:text-dim mt-0.5">${API.when(a.created_at)}</p>
      </li>`).join("") : `<li class="text-[12px] text-ink-3 dark:text-dim">아직 활동이 없음</li>`;
  }

  const msg = (kind, title, body) => {
    $("codeMsg").innerHTML = window.notice(kind, esc(title), esc(body));
    $("codeMsg").classList.remove("hidden");
  };
  const joinErr = (title, body) => {
    $("joinErr").innerHTML = window.notice("red", esc(title), esc(body));
    $("joinErr").classList.remove("hidden");
  };
  const JOIN_ERRORS = {
    INVITE_NOT_FOUND: ["없는 초대코드", "코드를 다시 확인. 가입한 계정은 그대로 유지됨"],
    TEAM_FULL: ["팀 정원이 찼음", "팀당 6명 이내"]
  };

  // F-02 소속 팀 없음 - 팀 만들기 · 초대코드로 합류
  function showOnboard(){
    sections.forEach(s => s.classList.toggle("hidden", s.id !== "onboard"));
    const p = new URLSearchParams(location.search);
    if (p.get("join_error")) {
      // F-03 가입 때 넣은 초대코드가 틀림
      $("joinCode").value = p.get("code") || "";
      joinErr(...(JOIN_ERRORS[p.get("join_error")] || ["합류하지 못함", "코드를 다시 확인"]));
    }
    const [nameInput, createBtn] = [createBox.querySelector("input"), createBox.querySelector("button")];
    createBtn.onclick = async () => {
      if (!nameInput.value.trim()) { nameInput.focus(); return; }
      createBtn.disabled = true;
      try {
        await API.call("POST", "/api/teams", { name: nameInput.value.trim() });
        location.href = "team.html";
      } catch (e) { createBtn.disabled = false; joinErr("팀을 만들지 못함", e.message); }
    };
    const joinBtn = joinBox.querySelector("button");
    joinBtn.onclick = async () => {
      if (!$("joinCode").value.trim()) { $("joinCode").focus(); return; }
      joinBtn.disabled = true;
      try {
        await API.call("POST", "/api/teams/join", { invite_code: $("joinCode").value.trim() });
        location.href = "meetings.html";
      } catch (e) {
        joinBtn.disabled = false;
        joinErr(...(JOIN_ERRORS[e.code] || ["합류하지 못함", e.message]));
      }
    };
  }

  // F-08 member 는 읽기만. owner 전용은 팀 이름 · 코드 재발급 (할 일 삭제는 칸반에서)
  function lockForMember(){
    $("tName").readOnly = true;
    $("tName").classList.add("opacity-60");
    // 퍼블리싱 F-08 과 같게 복사까지 잠근다
    [$("copyBtn"), $("newCodeBtn"), $("saveName")].forEach(b => { b.disabled = true; b.classList.add("opacity-40", "pointer-events-none"); });
  }

  async function showTeam(){
    sections.forEach(s => s.classList.toggle("hidden", s.id === "onboard"));
    $("tName").value = TEAM.name;
    $("code").textContent = TEAM.invite_code;
    if (TEAM.role !== "owner") lockForMember();
    [MEMBERS, ACTS] = await Promise.all([
      API.call("GET", `/api/teams/${TEAM.id}/members`),
      API.call("GET", `/api/teams/${TEAM.id}/activities`)
    ]);
    render();
  }

  // F-07 팀 이름 저장
  $("saveName").onclick = async () => {
    try {
      TEAM = { ...TEAM, ...(await API.call("PUT", `/api/teams/${TEAM.id}`, { name: $("tName").value.trim() })) };
      msg("green", "팀 이름을 저장함", TEAM.name);
    } catch (e) { msg("red", "저장하지 못함", e.message); }
  };
  // F-04 코드 복사 - 팀당 코드 하나
  $("copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(TEAM.invite_code); }
    catch (e) {}
    msg("green", "초대코드를 복사함", "받는 사람은 회원가입 화면의 초대코드 칸에 붙여넣음");
  };
  // F-05 코드 재발급 - 앞의 코드는 폐기
  $("newCodeBtn").onclick = async () => {
    const old = TEAM.invite_code;
    try {
      TEAM = { ...TEAM, ...(await API.call("PUT", `/api/teams/${TEAM.id}/code`)) };
      $("code").textContent = TEAM.invite_code;
      msg("orange", "초대코드를 다시 발급함", `앞의 코드 ${old} 는 더 쓸 수 없음. 이미 합류한 멤버는 그대로`);
    } catch (e) { msg("red", "재발급하지 못함", e.message); }
  };

  API.boot({ needTeam: false }).then(({ me, team }) => {
    ME = me; TEAM = team;
    if (!team) showOnboard();
    else showTeam();
  });
</script>
</body>
</html>
